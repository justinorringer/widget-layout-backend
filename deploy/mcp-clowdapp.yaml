---
apiVersion: v1
kind: Template
metadata:
  name: widget-layout-backend-mcp
objects:
- apiVersion: cloud.redhat.com/v1alpha1
  kind: ClowdApp
  metadata:
    name: widget-layout-backend-mcp
  spec:
    envName: ${ENV_NAME}
    optionalDependencies:
    - widget-layout-backend
    deployments:
    - name: app
      minReplicas: ${{MIN_REPLICAS}}
      webServices:
        private:
          enabled: true
      podSpec:
        image: ${IMAGE}:${IMAGE_TAG}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 10000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 10000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        env:
        - name: PORT
          value: "10000"
        - name: WIDGET_LAYOUT_API_URL
          value: "http://widget-layout-backend-api:8000"
        - name: LOG_LEVEL
          value: ${LOG_LEVEL}
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: ${CPU_LIMIT_MCP}
            memory: ${MEMORY_LIMIT_MCP}
          requests:
            cpu: ${CPU_REQUEST_MCP}
            memory: ${MEMORY_REQUEST_MCP}

parameters:
- description: ClowdEnv Name
  name: ENV_NAME
  value: "widget-layout-backend"
  required: true
- name: MIN_REPLICAS
  value: '1'
- description: Image name
  name: IMAGE
  value: quay.io/redhat-services-prod/hcc-platex-services-tenant/widget-layout-backend/widget-layout-backend-mcp
- description: Image tag
  name: IMAGE_TAG
  value: latest
  required: true
- description: The log level for the MCP sidecar
  name: LOG_LEVEL
  value: info
- description: Cpu limit of MCP sidecar
  name: CPU_LIMIT_MCP
  value: 250m
- description: Memory limit of MCP sidecar
  name: MEMORY_LIMIT_MCP
  value: 256Mi
- description: Cpu requests of MCP sidecar
  name: CPU_REQUEST_MCP
  value: 100m
- description: Memory requests of MCP sidecar
  name: MEMORY_REQUEST_MCP
  value: 128Mi
